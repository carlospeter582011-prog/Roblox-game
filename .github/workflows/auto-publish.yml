name: Auto Publish Roblox Place
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'default.project.json'
      - '.github/workflows/auto-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-production-publish
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: roblox-publishing
    steps:
      - uses: actions/checkout@v4
      - name: Install official pinned Rojo 7.4.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip -o /tmp/rojo.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo /tmp/rojo >> "$GITHUB_PATH"
      - name: Install pinned Luau CLI 0.746
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download 0.746 --repo luau-lang/luau --pattern 'luau-ubuntu.zip' --dir /tmp/luau
          unzip -q /tmp/luau/luau-ubuntu.zip -d /tmp/luau/bin
          chmod +x /tmp/luau/bin/luau /tmp/luau/bin/luau-analyze
          echo /tmp/luau/bin >> "$GITHUB_PATH"
      - name: Release gate - static analysis and unit tests (publish is skipped if these fail)
        shell: bash
        run: |
          set -euo pipefail
          luau-analyze src/server/ProfileCore.luau src/shared/CatchRules.luau src/shared/SpawnRules.luau src/shared/Leveling.luau src/shared/Mutations.luau src/shared/Encyclopedia.luau src/shared/ProgressRules.luau
          luau tests/run.luau
          python3 scripts/audit_3d_world.py
      - name: Check project and build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool default.project.json >/dev/null
          test -f src/server/StarterWorld.server.luau
          test -f src/server/CloudCatch.server.luau
          test -f src/server/ProfileStore.luau
          if grep -R -nE 'ROBLOX_API_KEY|BEGIN PRIVATE KEY' src/; then
            echo "Potential credential reference in source"; exit 1
          fi
          rojo build default.project.json --output game.rbxlx
          test -s game.rbxlx
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          assert ET.parse("game.rbxlx").getroot().tag == "roblox"
          print("Build XML verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-candidate
          path: game.rbxlx
          if-no-files-found: error
      - name: Publish to existing Roblox Place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PLACE: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          test "$UNIVERSE" = "6766580105"
          test "$PLACE" = "123021373220932"
          # A failed publish must expose a safe, actionable reason, never the API key.
          # Retry transient network errors, rate limits and Roblox 5xx responses.
          status=$(curl --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 3 --retry-max-time 120 --connect-timeout 15 --max-time 90 \
            --output /tmp/roblox-publish-response.json --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header "Content-Type: application/xml" \
            --data-binary @game.rbxlx \
            "https://apis.roblox.com/universes/v1/$UNIVERSE/places/$PLACE/versions?versionType=Published") || {
              echo "::error::Roblox publish transport failed (DNS, TLS, timeout, or connection)."
              exit 1
            }
          if [[ "$status" != "200" ]]; then
            echo "::error::Roblox publishing failed with HTTP $status."
            python3 - <<'PY'
          import json, pathlib, re
          p = pathlib.Path("/tmp/roblox-publish-response.json")
          try:
              body = json.loads(p.read_text()[:12000])
          except (OSError, ValueError):
              print("Roblox returned a non-JSON error response; check HTTP status and API configuration.")
          else:
              # Whitelist fields: never print arbitrary API response or secret-like values.
              if isinstance(body, dict):
                  for key in ("code", "error", "errorCode", "message", "errorMessage"):
                      value = body.get(key)
                      if isinstance(value, (str, int)) and len(str(value)) < 500:
                          safe = str(value)
                          safe = re.sub(r"(?i)(api[_-]?key|token|authorization)\s*[:=]\s*\S+", r"\1=[REDACTED]", safe)
                          print(f"Roblox {key}: {safe}")
                  if isinstance(body.get("errors"), list):
                      for item in body["errors"][:3]:
                          if isinstance(item, dict):
                              print("Roblox error code:", str(item.get("code", "unknown"))[:100])
                              print("Roblox error message:", str(item.get("message", "unknown"))[:300])
          PY
            case "$status" in
              400) echo "Check place file format and universe/place IDs." ;;
              401|403) echo "Check ROBLOX_API_KEY validity, publishing permissions, API key owner, and universe access." ;;
              404) echo "Check ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID and key access to this experience." ;;
              429) echo "Roblox rate limit; retries exhausted." ;;
              5??) echo "Roblox service error; retries exhausted." ;;
            esac
            exit 1
          fi
          echo "Roblox accepted Published place version."
